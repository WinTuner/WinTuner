name: Metrics
on:
  # Schedule automatically every 6 hours
  schedule: [{cron: "0 */6 * * *"}]
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GitHub Personal Access Token (stored as repository secret)
          token: ${{ secrets.METRICS_TOKEN }}

          # User info and general settings
          user: WinTuner
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Bangkok
          
          # Plugin: Isometric Commit Calendar (3D contribution graph)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Plugin: Languages (top used languages)
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # Plugin: Habits (coding/commit patterns)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Plugin: Topics (repository topics and tech stack tags)
          plugin_topics: yes
          plugin_topics_sort: stars
          plugin_topics_limit: 15
